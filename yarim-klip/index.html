<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yarım — Defter Klip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

  #bar .btn { padding: 8px 14px; font-size: 14px; }

  #sync .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  #sync textarea { width: 100%; box-sizing: border-box; height: 110px; margin-top: 8px; background: #0e0d0b; color: #e9e3d6; border: 1px solid #333; border-radius: 8px; font: 12px ui-monospace, monospace; }
  [hidden] { display: none !important; }
  body.render #start, body.render #bar, body.render #sync { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start">
  <h1>Yarım</h1>
  <p id="startNote">Karakalem defter klibi hazırlanıyor…</p>
  <button class="btn" id="startBtn" disabled>▶ Başlat</button>
</div>
<div id="bar" hidden>
  <button class="btn ghost" id="playBtn" type="button">❚❚</button>
  <span id="time">0:00 / 0:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Zaman">
  <label class="btn ghost" for="songFile">🎵 Şarkını yükle</label>
  <input id="songFile" type="file" accept="audio/*" hidden>
  <button class="btn ghost" id="syncBtn" type="button">⏱ Senkron</button>
</div>
<div id="sync" hidden></div>

<script>
'use strict';

/* =====================================================================
   SABİTLER
   Sahne 1920x1080 sanal alanda çizilir. Defter sayfası 1580x930'dur.
   ===================================================================== */
const W = 1920, H = 1080, FPS = 30;
const PAGE = { x: 170, y: 95 };
const PW = 1580, PH = 930;
const TAU = Math.PI * 2;
const HAND = "'Caveat', 'Segoe Print', 'Bradley Hand', cursive";
const PARAMS = new URLSearchParams(location.search);
const RENDER = PARAMS.has('render');
const BAR = (60 / 72) * 4;                 // demo müzik: 72 BPM, 4/4

/* =====================================================================
   YARDIMCILAR
   ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

const easeOut = (t) => 1 - Math.pow(1 - t, 3);

const P = (x, y) => ({ x, y });
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
const lerpP = (a, b, t) => P(lerp(a.x, b.x, t), lerp(a.y, b.y, t));
const addv = (a, b, s = 1) => P(a.x + b.x * s, a.y + b.y * s);
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function pathPoly(ctx, pts) { ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.closePath(); }

/* =====================================================================
   ŞARKI: sözler ve zamanlama (her satırın başladığı saniye)
   Varsayılan zamanlama 72 BPM'lik demo müziğe göredir; kendi şarkın
   için "⏱ Senkron" ile yeniden kaydedebilirsin.
   ===================================================================== */
const CUE_BARS = {
  v1_1: 4, v1_2: 6, v1_3: 8, v1_4: 10,
  pc_1: 12, pc_2: 13, pc_3: 14,
  c1_1: 16, c1_2: 18, c1_3: 20, c1_4: 22, c1_5: 23, c1_6: 24,
  v2_1: 28, v2_2: 30, v2_3: 32, v2_4: 34, v2_5: 36,
  c2_1: 38, c2_2: 40, c2_3: 42, c2_4: 44, c2_5: 45, c2_6: 46,
  br_1: 49, br_2: 51, br_3: 53,
  out_1: 56, out_2: 58, out_3: 60,
  end: 62,
};
const CUE_ORDER = Object.keys(CUE_BARS);
const LYRICS = {
  v1_1: 'Duvardaki saat durmuş, umrumda değil',
  v1_2: 'Zaten zaman benim için akmıyor ne zamandır.',
  v1_3: 'Herkes bir yerlere yetişiyor bu şehirde,',
  v1_4: 'Ben sadece senin bıraktığın o boşluğa bakıyorum.',
  pc_1: 'Gittiğin günden beri',
  pc_2: 'Sus pus oldu içimdeki o şenlik.',
  pc_3: 'Saklandım... Herkesten, en çok da kendimden.',
  c1_1: 'Yarım kaldım, inkar etmiyorum!',
  c1_2: 'Biraz kızgınım sana, çokça da yorgun...',
  c1_3: 'Ne son bir mektup, ne de bir veda sözü;',
  c1_4: 'Sadece öylece gittin.',
  c1_5: 'Gittin ve bittik.',
  c1_6: 'Bittik...',
  v2_1: 'Denedim unutmayı, denedim başkalarına gülmeyi',
  v2_2: 'Ama yüzümdeki o sahte maske ağır geldi.',
  v2_3: 'Sokak lambaları aydınlatmıyor artık yolları,',
  v2_4: 'İçimde karanlık var, içimde kör bir kuyu.',
  v2_5: 'Düşüyorum... tutanım yok.',
  c2_1: 'Yarım kaldım, inkar etmiyorum!',
  c2_2: 'Biraz kızgınım sana, çokça da yorgun...',
  c2_3: 'Ne son bir mektup, ne de bir veda sözü;',
  c2_4: 'Sadece öylece gittin.',
  c2_5: 'Gittin ve bittik.',
  c2_6: 'Bittik...',
  br_1: 'Şimdi sorsalar "pişman mısın?" diye',
  br_2: 'İnan ki tek bir cevabım bile yok.',
  br_3: 'Sadece... canım yanıyor.',
  out_1: 'Öylece gittin...',
  out_2: 'Yarım kaldım...',
  out_3: 'Bittik.',
  end: '(şarkının sonu)',
};

function defaultCues() {
  const c = {};
  for (const k of CUE_ORDER) c[k] = +(CUE_BARS[k] * BAR).toFixed(3);
  return c;
}
function sanitizeCues(obj) {
  const src = obj && obj.cues ? obj.cues : obj;
  if (!src || typeof src !== 'object') return null;
  const c = {};
  let last = 0;
  for (const k of CUE_ORDER) {
    const v = Number(src[k]);
    if (!isFinite(v) || v < last) return null;
    c[k] = v;
    last = v;
  }
  return c;
}
function loadSavedCues() {
  try { return sanitizeCues(JSON.parse(localStorage.getItem('yarim-cues') || 'null')); } catch (e) { return null; }
}

/* =====================================================================
   DOKULAR (grafit, kâğıt, masa, karton, film greni)
   ===================================================================== */
const TEX = {};
function noiseCanvas(size, seed, fn) {
  const c = makeCanvas(size, size), g = c.getContext('2d');
  const id = g.createImageData(size, size), r = mulberry32(seed);
  for (let i = 0; i < size * size; i++) fn(id.data, i * 4, r);
  g.putImageData(id, 0, 0);
  return c;
}
function buildTextures() {
  TEX.graphite = noiseCanvas(256, 3, (d, o, r) => {
    const v = r();
    const a = v < 0.1 ? 0.12 + v * 2 : 0.55 + 0.45 * r();
    d[o] = 38; d[o + 1] = 37; d[o + 2] = 42; d[o + 3] = a * 255;
  });
  const paperBase = (col, seed, fib) => {
    const c = noiseCanvas(512, seed, (d, o, r) => {
      const n = (r() - 0.5) * 14;
      d[o] = col[0] + n; d[o + 1] = col[1] + n; d[o + 2] = col[2] + n; d[o + 3] = 255;
    });
    const g = c.getContext('2d'), r = mulberry32(seed + 1);
    for (let i = 0; i < fib; i++) {
      g.strokeStyle = r() < 0.5 ? 'rgba(110,90,60,0.05)' : 'rgba(255,255,255,0.09)';
      g.lineWidth = 1;
      const x = r() * 512, y = r() * 512, a = r() * TAU, l = 4 + r() * 14;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    return c;
  };
  TEX.paper = paperBase([239, 233, 220], 5, 700);
  TEX.paperBack = paperBase([226, 219, 204], 9, 500);
  TEX.card = noiseCanvas(512, 11, (d, o, r) => {
    const n = (r() - 0.5) * 22 + (r() < 0.03 ? 25 : 0);
    d[o] = 58 + n; d[o + 1] = 54 + n; d[o + 2] = 50 + n; d[o + 3] = 255;
  });
  TEX.cardIn = noiseCanvas(512, 12, (d, o, r) => {
    const n = (r() - 0.5) * 16;
    d[o] = 176 + n; d[o + 1] = 168 + n; d[o + 2] = 154 + n; d[o + 3] = 255;
  });
  const desk = makeCanvas(1024, 512), dg = desk.getContext('2d');
  dg.fillStyle = '#2a231e';
  dg.fillRect(0, 0, 1024, 512);
  const r = mulberry32(21);
  for (let i = 0; i < 160; i++) {
    const y0 = r() * 512, a = 2 + r() * 6, f = 0.004 + r() * 0.01, ph = r() * TAU;
    dg.strokeStyle = r() < 0.5 ? `rgba(0,0,0,${0.08 + r() * 0.12})` : `rgba(120,95,70,${0.05 + r() * 0.08})`;
    dg.lineWidth = 1 + r() * 2.5;
    dg.beginPath();
    for (let x = 0; x <= 1024; x += 16) dg.lineTo(x, y0 + Math.sin(x * f + ph) * a);
    dg.stroke();
  }
  TEX.desk = desk;
  TEX.grain = [0, 1, 2].map((k) => noiseCanvas(256, 31 + k, (d, o, r2) => {
    const v = r2() * 255;
    d[o] = v; d[o + 1] = v; d[o + 2] = v; d[o + 3] = 255;
  }));
}
const PATS = new WeakMap();
function pat(ctx, name, idx) {
  let m = PATS.get(ctx);
  if (!m) { m = {}; PATS.set(ctx, m); }
  const key = idx === undefined ? name : name + idx;
  if (!m[key]) m[key] = ctx.createPattern(idx === undefined ? TEX[name] : TEX[name][idx], 'repeat');
  return m[key];
}

/* =====================================================================
   GEOMETRİ
   ===================================================================== */
function catmull(pts, closed = false, seg = 8) {
  const n = pts.length;
  if (n < 3) return pts.map((p) => P(p.x, p.y));
  const get = (i) => (closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)]);
  const out = [];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    for (let s = 0; s < seg; s++) {
      const t = s / seg, t2 = t * t, t3 = t2 * t;
      out.push(P(
        0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
      ));
    }
  }
  out.push(closed ? P(pts[0].x, pts[0].y) : P(pts[n - 1].x, pts[n - 1].y));

}
function resample(pts, step) {
  if (pts.length < 2) return pts.map((p) => P(p.x, p.y));

  let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const d = dist(a, b);
    if (d === 0) continue;
    let s = step - carry;
    while (s <= d) { out.push(lerpP(a, b, s / d)); s += step; }
    carry = d - (s - step);
  }
  const lastP = pts[pts.length - 1];
  if (dist(out[out.length - 1], lastP) > 0.5) out.push(P(lastP.x, lastP.y));
  return out;
}
function ellipsePts(cx, cy, rx, ry, o = {}) {
  const a0 = o.a0 ?? -Math.PI * 0.62, sweep = o.sweep ?? TAU * 1.06, rot = o.rot || 0;
  const n = Math.max(16, Math.ceil(((rx + ry) * Math.abs(sweep)) / 9));
  const c = Math.cos(rot), s = Math.sin(rot), ph = o.ph ?? 0.7;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (sweep * i) / n;
    const wob = 1 + (o.wob ?? 0.018) * Math.sin(a * 3 + ph);
    const x = Math.cos(a) * rx * wob, y = Math.sin(a) * ry * wob;
    pts.push(P(cx + x * c - y * s, cy + x * s + y * c));
  }

}
function circlePoly(cx, cy, rx, ry = rx, n = 40) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * TAU; pts.push(P(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry)); }
  return pts;
}
const rectRing = (x, y, w, h) => [P(x, y), P(x + w, y), P(x + w, y + h), P(x, y + h)];
function zigzag(x0, y0, x1, y1, row) {
  const pts = [];
  let k = 0;
  for (let y = y0; y <= y1 + 0.1; y += row, k++) {
    if (k % 2 === 0) { pts.push(P(x0, y)); pts.push(P(x1, y + row * 0.5)); }
    else { pts.push(P(x1, y)); pts.push(P(x0, y + row * 0.5)); }
  }
  return pts;
}
function scribblePts(cx, cy, rx, ry, n, seed) {
  const r = mulberry32(seed), pts = [];
  let a = r() * TAU;
  for (let i = 0; i < n; i++) {
    a += 1.9 + r() * 1.6;
    const k = 0.35 + r() * 0.65;
    pts.push(P(cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k));

}
function ik2(s, target, l1, l2, bend = 1) {
  let dx = target.x - s.x, dy = target.y - s.y;

  if (d > maxd) { dx *= maxd / d; dy *= maxd / d; d = maxd; }

/* =====================================================================
   KARAKALEM ÇİZİM İŞLEMLERİ
   Her işlem (op) bir geometri ve [t0,t1] zaman aralığı taşır; o aralıkta
   kademeli olarak çizilir. Silgi işlemleri grafit katmanından siler.
   ===================================================================== */
let SEED = 1;
const nextSeed = () => (SEED = (SEED * 16807) % 2147483647);

  const nx = new Float32Array(n), ny = new Float32Array(n), j1 = new Float32Array(n), j2 = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];

}

function jagLine(x0, seed) {

    pts.push(P(x + (r() - 0.5) * 6, y));
  }
  return pts;
}

    const a = poly[i], b = poly[(i + 1) % poly.length];

    for (let k = 0; k < n; k++) { const q = lerpP(a, b, k / n); out.push(P(q.x + (r() - 0.5) * 7, q.y + (r() - 0.5) * 7)); }
  }

}
function polyCentroid(poly) {

}
function makeThrow(page, t, poly, target, o = {}) {

  const blob = pts.map((p, i) => { const d = dist(p, C) || 1; const k = 110 * (0.72 + 0.5 * r()); return P(C.x + ((p.x - C.x) / d) * k, C.y + ((p.y - C.y) / d) * k); });

const SNAP = new Map();
const SNAP_SMALL = new Map();
const SNAP_SCALE = RENDER ? 1.2 : 0.9;
function getSnapshot(S, page, t, small = false) {
  const key = `${page.id}@${t.toFixed(3)}${small ? 's' : ''}`;
  if (SNAP.has(key)) { const v = SNAP.get(key); SNAP.delete(key); SNAP.set(key, v); return v; }
  let c;
  if (small) {
    if (SNAP_SMALL.has(key)) return SNAP_SMALL.get(key);
    const big = getSnapshot(S, page, t, false);
    c = makeCanvas(PW / 5, PH / 5);
    c.getContext('2d').drawImage(big, 0, 0, c.width, c.height);
    SNAP_SMALL.set(key, c);
    return c;
  } else {
    const sc = SNAP_SCALE;
    c = makeCanvas(PW * sc, PH * sc);
    const R = { canvas: c, ctx: c.getContext('2d'), layer: makeCanvas(PW * sc, PH * sc) };
    R.lctx = R.layer.getContext('2d');
    drawPageContent(R, S, page, t, (x) => x.setTransform(sc, 0, 0, sc, 0, 0), true);

function drawThrow(ctx, S, pc, t) {
  const u = clamp((t - pc.t0) / (pc.t1 - pc.t0), 0, 1);

  const pos = lerpP(start, pc.target, fly);

  const s = lerp(1 + lift * 0.04, 0.34, easeIn(range(u, 0.3, 0.85)));

  ctx.translate(-pc.C.x, -pc.C.y);

  ctx.restore();
  ctx.save();
  pathPoly(ctx, poly);

  ctx.translate(pc.C.x, pc.C.y);
  ctx.scale(k, k);
  ctx.translate(-pc.C.x, -pc.C.y);
  ctx.drawImage(snap, 0, 0, PW, PH);
  ctx.restore();
  if (crum > 0.02) {
    ctx.save();
    pathPoly(ctx, poly);
    ctx.clip();
    const g = ctx.createRadialGradient(pc.C.x - 30, pc.C.y - 30, 10, pc.C.x, pc.C.y, 150);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.6, `rgba(60,50,40,${0.25 * crum})`);
    g.addColorStop(1, `rgba(30,24,18,${0.7 * crum})`);

      ctx.beginPath(); ctx.moveTo(c[0].x + 2, c[0].y + 2); ctx.lineTo(c[1].x + 2, c[1].y + 2); ctx.lineTo(c[2].x + 2, c[2].y + 2); ctx.stroke();
    }

  ctx.lineWidth = 3;
  pathPoly(ctx, poly);

  ctx.restore();

function drawFlip(ctx, S, pc, t, setPage) {
  const u = easeInOut(range(t, pc.t0, pc.t1));

function drawFall(ctx, S, pc, t, setPage) {

  ctx.stroke();

// Kâğıdın göğüs hizasından yanması (klipteki tek renk)
function drawBurn(ctx, c, dt) {
  if (dt < 0) return;

  const R = 6 + 48 * grow;
  const poly = [];
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * TAU;
    const n = 1 + 0.12 * Math.sin(a * 3 + 1) + 0.07 * Math.sin(a * 5 + 2) + 0.035 * Math.sin(a * 11);
    poly.push(P(c.x + Math.cos(a) * R * n, c.y + Math.sin(a) * R * n * 0.9));
  }
  const heat = dt < 5.5 ? 1 : Math.max(0.25, 1 - (dt - 5.5) * 0.12);
  ctx.save();
  const halo = ctx.createRadialGradient(c.x, c.y, R * 0.6, c.x, c.y, R * 1.9);
  halo.addColorStop(0, 'rgba(70,40,20,0.75)');
  halo.addColorStop(0.5, 'rgba(120,80,40,0.35)');
  halo.addColorStop(1, 'rgba(120,80,40,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(c.x, c.y, R * 1.9, 0, TAU); ctx.fill();
  const hole = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, R);
  hole.addColorStop(0, '#0d0a08');
  hole.addColorStop(1, '#1d140e');
  ctx.fillStyle = hole;
  pathPoly(ctx, poly);
  ctx.fill();
  const flick = 0.75 + 0.25 * Math.sin(dt * 23) * Math.sin(dt * 7.3);
  ctx.shadowColor = `rgba(255,120,30,${0.9 * heat})`;
  ctx.shadowBlur = 18;
  ctx.strokeStyle = `rgba(255,${140 + 40 * flick},60,${0.95 * heat * flick})`;
  ctx.lineWidth = 3.5;
  pathPoly(ctx, poly);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = `rgba(255,220,150,${0.7 * heat * flick})`;
  ctx.lineWidth = 1.2;
  ctx.stroke();
  const r = mulberry32(12);
  for (let i = 0; i < 26; i++) {
    const life = 1.2 + r() * 1.3, ph = r() * life, a = r() * TAU;
    const age = ((dt + ph) % life) / life;
    const x = c.x + Math.cos(a) * R * 0.95 + Math.sin(age * 6 + i) * 8, y = c.y + Math.sin(a) * R * 0.85 - age * (80 + r() * 60);
    ctx.fillStyle = `rgba(255,${150 + r() * 80},60,${(1 - age) * heat * 0.9})`;
    ctx.beginPath(); ctx.arc(x, y, 1.2 + r() * 1.8, 0, TAU); ctx.fill();
  }
  ctx.filter = 'blur(10px)';
  for (let i = 0; i < 6; i++) {
    const age = ((dt * 0.4 + i / 6) % 1);
    ctx.fillStyle = `rgba(90,85,80,${0.18 * (1 - age) * heat})`;
    ctx.beginPath(); ctx.arc(c.x + Math.sin(age * 5 + i) * 30, c.y - R - age * 220, 18 + age * 40, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* =====================================================================
   ÇİZİM: masa, defter, sayfa, kalem, ışık
   ===================================================================== */
function cameraAt(S, t) {
  const K = S.camKeys;
  let x = K[0].x, y = K[0].y, z = K[0].z, r = K[0].r;
  if (t >= K[K.length - 1].t) ({ x, y, z, r } = K[K.length - 1]);
  else {
    for (let i = 1; i < K.length; i++) {
      if (t <= K[i].t) {
        const a = K[i - 1], b = K[i], u = easeInOut(range(t, a.t, b.t));
        x = lerp(a.x, b.x, u); y = lerp(a.y, b.y, u); z = lerp(a.z, b.z, u); r = lerp(a.r, b.r, u);
        break;
      }
    }
  }
  x += 2.4 * Math.sin(t * 0.53) + 1.3 * Math.sin(t * 1.31);
  y += 2.0 * Math.sin(t * 0.61 + 1) + 1.1 * Math.sin(t * 1.7);
  r += 0.0016 * Math.sin(t * 0.4);
  for (const sh of S.shakes) {
    if (t < sh.t || t > sh.t + sh.dur) continue;
    const k = 1 - (t - sh.t) / sh.dur;
    x += sh.amp * k * Math.sin(t * 61 + sh.t);
    y += sh.amp * k * Math.cos(t * 53 + sh.t * 2);
  }
  return { x, y, z, r };
}

function drawPaperFace(ctx, page) {
  ctx.fillStyle = pat(ctx, 'paper');
  ctx.fillRect(0, 0, PW, PH);
  ctx.strokeStyle = 'rgba(80,115,160,0.16)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let y = 112; y < PH - 10; y += 44) { ctx.moveTo(0, y); ctx.lineTo(PW, y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(200,80,80,0.16)';
  ctx.beginPath(); ctx.moveTo(108, 60); ctx.lineTo(108, PH); ctx.stroke();
  const g = ctx.createLinearGradient(0, 0, 0, 90);
  g.addColorStop(0, 'rgba(0,0,0,0.12)');
  g.addColorStop(1, 'rgba(0,0,0,0)');

// Sayfanın kâğıdı + grafit katmanı + hareketli öğeleri
function drawPageContent(R, S, page, t, setPage, noClip) {
  const ctx = R.ctx, lc = R.lctx;
  ctx.save();
  setPage(ctx);
  if (!noClip) {
    const shape = page.shapeAt(t);
    pathPoly(ctx, shape || rectRing(0, 0, PW, PH));
    ctx.clip();
  }
  if (page.kind === 'cover') { drawCoverFace(ctx); ctx.restore(); return; }
  drawPaperFace(ctx, page);
  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.clearRect(0, 0, R.layer.width, R.layer.height);
  setPage(lc);
  for (const op of page.ops) {
    if (op.t0 > t) break;
    drawOp(lc, op, op.t1 <= op.t0 ? 1 : clamp((t - op.t0) / (op.t1 - op.t0), 0, 1));
  }
  for (const d of page.dyn) {
    if (d.layer !== 'g' || t < d.t0 || t > d.t1) continue;
    lc.save(); d.draw(lc, t); lc.restore();
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(R.layer, 0, 0);
  ctx.restore();
  for (const d of page.dyn) {
    if (d.layer !== 'top' || t < d.t0 || t > d.t1) continue;
    ctx.save(); d.draw(ctx, t); ctx.restore();
  }
  ctx.restore();
}

function visibleStack(S, t) {
  const out = [];
  for (const p of S.pages) {
    if (!p.presentAt(t)) continue;
    out.push(p);
    if (!p.shapeAt(t) && p.kind !== 'cover') break;
  }
  return out.reverse();
}

function toolState(S, tool, t) {
  const L = S.pencilTools[tool];
  let i = -1;
  for (let k = 0; k < L.length; k++) { if (L[k].t0 <= t) i = k; else break; }
  const world = (p) => P(PAGE.x + p.x, PAGE.y + p.y);
  const park = tool === 'pencil' ? P(2250, 1350) : P(2300, 900);
  const cur = L[i];
  if (cur && t < cur.t1) {
    const f = (t - cur.t0) / (cur.t1 - cur.t0);
    const h = cur.kind === 'hover' ? 0.5 - 0.5 * Math.cos(TAU * cur.g.taps * f) : 0;
    return { vis: true, p: world(opTip(cur, f)), h };
  }
  const prev = cur, next = L[i + 1];
  const pEnd = prev ? world(opTip(prev, 1)) : park, nStart = next ? world(opTip(next, 0)) : park;
  if (prev && next && next.t0 - prev.t1 < 1.6) {
    const u = easeInOut(range(t, prev.t1, next.t0));
    return { vis: true, p: lerpP(pEnd, nStart, u), h: Math.sin(u * Math.PI) * Math.min(1, dist(pEnd, nStart) / 250) };
  }
  if (prev && t - prev.t1 < 0.8) { const u = easeIn(range(t, prev.t1, prev.t1 + 0.8)); return { vis: true, p: lerpP(pEnd, park, u), h: Math.min(1, u * 3) }; }
  if (next && next.t0 - t < 0.8) { const u = easeOut(range(t, next.t0 - 0.8, next.t0)); return { vis: true, p: lerpP(park, nStart, u), h: Math.min(1, (1 - u) * 3) }; }
  return { vis: false };
}

function drawPencil(ctx, p, h, broken) {
  const ang = 0.62;
  ctx.save();
  ctx.translate(p.x + 12 + h * 45, p.y + 16 + h * 60);
  ctx.rotate(ang);
  ctx.filter = `blur(${6 + h * 8}px)`;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(72, -12); ctx.lineTo(640, -12); ctx.lineTo(640, 12); ctx.lineTo(72, 12); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(p.x, p.y - h * 6);
  ctx.scale(1 + h * 0.05, 1 + h * 0.05);
  ctx.rotate(ang);
  const wood = ctx.createLinearGradient(0, -12, 0, 12);
  wood.addColorStop(0, '#ecd3ad'); wood.addColorStop(1, '#b8895a');
  ctx.fillStyle = wood;
  ctx.beginPath();

  const ctx = R.ctx, v = R.view;
  const cam = cameraAt(S, t);
  const setWorld = (c) => { c.setTransform(v.s, 0, 0, v.s, v.ox, v.oy); c.translate(W / 2, H / 2); c.scale(cam.z, cam.z); c.rotate(cam.r); c.translate(-cam.x, -cam.y); };
  const setPage = (c) => { setWorld(c); c.translate(PAGE.x, PAGE.y); };
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, R.canvas.width, R.canvas.height);
  ctx.save();

  }

  }

  const broken = S.broken.some((b) => t >= b.t0 && t < b.t1);
  const er = toolState(S, 'eraser', t);
  if (er.vis) drawEraserTool(ctx, er.p, er.h);
  const pe = toolState(S, 'pencil', t);
  if (pe.vis) drawPencil(ctx, pe.p, pe.h, broken);

  ctx.setTransform(v.s, 0, 0, v.s, v.ox, v.oy);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgb(255,241,220)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createRadialGradient(W * 0.42, H * 0.36, 220, W * 0.5, H * 0.5, 1250);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.1)');
  g.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.05;
  ctx.globalCompositeOperation = 'overlay';
  const gi = ((Math.floor(t * 12) % 3) + 3) % 3;
  ctx.save();
  ctx.translate((gi * 97) % 256, (gi * 57) % 256);
  ctx.fillStyle = pat(ctx, 'grain', gi);
  ctx.fillRect(-256, -256, W + 512, H + 512);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  const dark = blackAt(S, t);
  if (dark > 0.001) { ctx.fillStyle = `rgba(0,0,0,${dark})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();

  master.gain.value = 0.9;
  master.connect(ac.destination);

  rev.buffer = makeImpulse(ac, 3);
  const revG = ac.createGain(); revG.gain.value = 0.3;
  rev.connect(revG); revG.connect(master);

    const bus = ac.createGain();
    const f0 = C.end - 2.5, f1 = C.end + 3;
    const fade = (t) => (t <= f0 ? 0.85 : t >= f1 ? 0.0001 : lerp(0.85, 0.0001, (t - f0) / (f1 - f0)));
    bus.gain.setValueAtTime(fade(c0), 0);
    if (f1 > c0) { if (f0 > c0) bus.gain.setValueAtTime(0.85, f0 - c0); bus.gain.linearRampToValueAtTime(0.0001, f1 - c0); }
    bus.connect(master); bus.connect(rev);
    const a = Math.floor(c0 * sr), b = Math.min(guitar[0].length, Math.floor(c1 * sr));
    if (b > a) {
      const gb = ac.createBuffer(2, b - a, sr);
      gb.copyToChannel(guitar[0].subarray(a, b), 0); gb.copyToChannel(guitar[1].subarray(a, b), 1);
      const src = ac.createBufferSource(); src.buffer = gb;
      const gg = ac.createGain(); gg.gain.value = 0.42;
      src.connect(gg); gg.connect(bus); src.start(0);
    }
    for (const n of music.piano) {
      if (!inC(n.t)) continue;
      const f = mtof(n.m), t = at(n.t);
      [[1, 1], [2, 0.42], [3, 0.18], [4.02, 0.07]].forEach(([k, amp]) => {
        const osc = ac.createOscillator(); osc.frequency.value = f * k;
        const g = ac.createGain();

        g.gain.setTargetAtTime(0, t + 0.006, (1.6 * Math.pow(220 / f, 0.3)) / Math.sqrt(k));
        g.gain.setTargetAtTime(0, t + n.dur, 0.12);

      const g = ac.createGain();

      g.gain.linearRampToValueAtTime(0.018 * n.vel, t + 0.9);
      g.gain.setValueAtTime(0.018 * n.vel, t + n.dur - 0.2);

      const t = at(n.t);
      const osc = ac.createOscillator(); osc.frequency.value = mtof(n.m);
      const osc2 = ac.createOscillator(); osc2.type = 'triangle'; osc2.frequency.value = mtof(n.m);

      osc.start(t); osc.stop(t + n.dur + 0.2); osc2.start(t); osc2.stop(t + n.dur + 0.2);
    }

      if (d.k === 'kick') { const osc = ac.createOscillator(); osc.frequency.setValueAtTime(120, t); osc.frequency.exponentialRampToValueAtTime(45, t + 0.15); osc.connect(env(ac, bus, t, 0.42 * d.vel, 0.003, 0.3, 0.12)); osc.start(t); osc.stop(t + 0.4); }
      else if (d.k === 'snare') noiseSrc(ac, t, 0.22, [['bandpass', 2000, 0.6]], env(ac, bus, t, 0.13 * d.vel, 0.003, 0.2, 0.1));
      else if (d.k === 'hat') noiseSrc(ac, t, 0.05, [['highpass', 8000, 0.7]], env(ac, bus, t, 0.025 * d.vel, 0.002, 0.04));

    const bus = ac.createGain(); bus.gain.value = o.sfxGain ?? 1;

    const sr2 = ac.createGain(); sr2.gain.value = 0.25; bus.connect(sr2); sr2.connect(rev);

function wavBase64(buf) {
  const ch = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate;
  const view = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); view.setUint32(4, 36 + len * ch * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, ch, true);
  view.setUint32(24, sr, true); view.setUint32(28, sr * ch * 2, true); view.setUint16(32, ch * 2, true); view.setUint16(34, 16, true);
  str(36, 'data'); view.setUint32(40, len * ch * 2, true);
  const chans = [];
  for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
  let off = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) { const s = clamp(chans[c][i], -1, 1); view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true); off += 2; }
  const bytes = new Uint8Array(view.buffer);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/* =====================================================================
   UYGULAMA: canlı oynatıcı, şarkı yükleme, senkron kaydı, render arayüzü
   ===================================================================== */
const canvas = document.getElementById('c');
const R = { canvas, ctx: canvas.getContext('2d'), layer: makeCanvas(8, 8), view: { s: 1, ox: 0, oy: 0 } };
R.lctx = R.layer.getContext('2d');
let STORY = null;

function setSize(w, h, view) {
  canvas.width = w; canvas.height = h;
  R.layer.width = w; R.layer.height = h;
  R.view = view;
}
function fitScreen() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
  const s = Math.min(w / W, h / H);
  setSize(w, h, { s, ox: (w - W * s) / 2, oy: (h - H * s) / 2 });
}
async function fontsReady() {
  try { await Promise.race([Promise.all([document.fonts.load(`600 48px ${HAND}`), document.fonts.load(`700 48px ${HAND}`)]), new Promise((r) => setTimeout(r, 4000))]); } catch (e) { /* yedek yazı tipi */ }
}
function rebuild(cues) {
  STORY = buildStory(cues);
  SNAP.clear();
  SNAP_SMALL.clear();
  return STORY;
}

if (RENDER) {
  document.body.classList.add('render');
  window.KLIP = {
    async init(o = {}) {
      buildTextures();
      await fontsReady();
      const cues = (o.cues && sanitizeCues(o.cues)) || defaultCues();
      rebuild(cues);
      const sc = o.scale || 1;
      setSize(Math.round(W * sc), Math.round(H * sc), { s: sc, ox: 0, oy: 0 });
      return { duration: STORY.duration, fps: FPS, frames: Math.ceil(STORY.duration * FPS), font: document.fonts.check(`600 40px 'Caveat'`) };
    },
    frame(i, q) { renderFrame(R, STORY, i / FPS); return canvas.toDataURL('image/jpeg', q || 0.92); },
    async audio(o) { return wavBase64(await renderAudio(STORY, o || {})); },
  };
} else {
  const $ = (id) => document.getElementById(id);
  const startBox = $('start'), startBtn = $('startBtn'), startNote = $('startNote'), bar = $('bar'), playBtn = $('playBtn'), seek = $('seek'), timeEl = $('time'), syncBox = $('sync');
  const player = { ac: null, tracks: [], sources: [], playing: false, offset: 0, startAt: 0, perf0: 0 };
  let song = null;
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const now = () => (player.playing ? (player.ac ? player.ac.currentTime - player.startAt : (performance.now() - player.perf0) / 1000) : player.offset);
  function play() {
    if (player.playing) return;
    if (player.ac) {
      player.ac.resume();
      const at = player.ac.currentTime + 0.05;
      player.sources = player.tracks.map((tr) => {
        const s = player.ac.createBufferSource(); s.buffer = tr.buf;
        const g = player.ac.createGain(); g.gain.value = tr.gain;
        if (!player.comp) { player.comp = player.ac.createDynamicsCompressor(); player.comp.threshold.value = -16; player.comp.ratio.value = 3; player.comp.connect(player.ac.destination); }
        s.connect(g); g.connect(player.comp);
        s.start(at, Math.min(player.offset, tr.buf.duration));
        return s;
      });
      player.startAt = at - player.offset;
    } else player.perf0 = performance.now() - player.offset * 1000;
    player.playing = true;
    playBtn.textContent = '❚❚';
  }
  function pause() {
    if (!player.playing) return;
    player.offset = now();
    player.sources.forEach((s) => { try { s.stop(); } catch (e) { /* bitti */ } });
    player.sources = [];
    player.playing = false;
    playBtn.textContent = '▶';
  }
  function seekTo(t) { const was = player.playing; pause(); player.offset = clamp(t, 0, STORY.duration); if (was) play(); }
  async function prepareAudio() {
    try {
      if (!player.ac) player.ac = new (window.AudioContext || window.webkitAudioContext)();
      player.tracks = [];
      const toBuf = (r) => { const b = player.ac.createBuffer(2, r.length, r.sampleRate); b.copyToChannel(r.getChannelData(0), 0); b.copyToChannel(r.getChannelData(1), 1); return b; };
      if (song) {
        const sfx = toBuf(await renderAudio(STORY, { music: false, sfxGain: 0.8 }));
        player.tracks = [{ buf: song, gain: 1 }, { buf: sfx, gain: 0.8 }];
      } else player.tracks = [{ buf: toBuf(await renderAudio(STORY, {})), gain: 1 }];
    } catch (e) { console.warn('Ses hazırlanamadı:', e); player.ac = null; player.tracks = []; }
  }
  async function applyCues(cues, restart = true) {
    pause();
    rebuild(cues);
    startNote.textContent = 'Ses yeniden hazırlanıyor…';
    await prepareAudio();
    if (restart) { player.offset = 0; play(); }
  }
  playBtn.onclick = () => (player.playing ? pause() : play());
  seek.oninput = () => seekTo((seek.value / 1000) * STORY.duration);
  let hideTimer = 0;
  const poke = () => { bar.classList.remove('hide'); clearTimeout(hideTimer); hideTimer = setTimeout(() => player.playing && bar.classList.add('hide'), 2600); };
  window.addEventListener('pointermove', poke);
  window.addEventListener('pointerdown', poke);
  window.addEventListener('resize', fitScreen);

  $('songFile').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    pause();
    if (!player.ac) player.ac = new (window.AudioContext || window.webkitAudioContext)();
    try {
      song = await player.ac.decodeAudioData(await file.arrayBuffer());
      await prepareAudio();
      seekTo(0); play();
      openSync(true);
    } catch (err) { alert('Ses dosyası okunamadı: ' + err.message); }
  };

  // Senkron kaydı: şarkı çalarken her satırın başında BOŞLUK'a bas
  let sync = null;
  function openSync(hint) {
    syncBox.hidden = false;
    const saved = loadSavedCues();
    syncBox.innerHTML = `<h3>⏱ Şarkıyla senkron</h3>
      <div>${song ? 'Şarkın yüklü.' : 'Önce <b>🎵 Şarkını yükle</b> ile kaydını seç (mp3/wav).'} “Kaydı başlat”a bas; şarkı baştan çalar.
      Her satır <b>söylenmeye başladığı an</b> BOŞLUK tuşuna (ya da “Şimdi”) bas. En sonda şarkı bittiğinde bir kez daha bas.</div>
      <div class="row"><button class="btn" id="sStart" ${song ? '' : 'disabled'}>Kaydı başlat</button><button class="btn ghost" id="sNow" disabled>Şimdi</button>
      <button class="btn ghost" id="sReset">${saved ? 'Kayıtlı zamanlamayı sil' : 'Varsayılan zamanlama'}</button><button class="btn ghost" id="sClose">Kapat</button></div>
      <ol id="sList">${CUE_ORDER.map((k) => `<li>${LYRICS[k]}</li>`).join('')}</ol><div id="sOut"></div>`;
    $('sClose').onclick = () => { syncBox.hidden = true; sync = null; };
    $('sReset').onclick = async () => { localStorage.removeItem('yarim-cues'); await applyCues(defaultCues()); syncBox.hidden = true; };
    $('sStart').onclick = () => { sync = { i: 0, cues: {} }; $('sNow').disabled = false; seekTo(0); play(); markList(); };
    $('sNow').onclick = () => mark();
    if (hint && song) syncBox.querySelector('div').insertAdjacentHTML('afterbegin', '<p style="margin:0 0 6px;color:#e7c98e">Klibi şarkına oturtmak için satır başlarını bir kez işaretle.</p>');
  }
  function markList() {
    const lis = syncBox.querySelectorAll('#sList li');
    lis.forEach((li, i) => { li.className = i < sync.i ? 'done' : i === sync.i ? 'next' : ''; });
    const next = lis[sync.i];
    if (next) next.scrollIntoView({ block: 'nearest' });
  }
  async function mark() {
    if (!sync) return;
    sync.cues[CUE_ORDER[sync.i]] = +now().toFixed(3);
    sync.i++;
    markList();
    if (sync.i >= CUE_ORDER.length) {
      const cues = sanitizeCues(sync.cues);
      sync = null;
      if (!cues) { $('sOut').textContent = 'Zamanlar sırasız görünüyor, tekrar dene.'; return; }
      const json = JSON.stringify({ cues }, null, 1);
      localStorage.setItem('yarim-cues', JSON.stringify(cues));
      $('sOut').innerHTML = `<p>Kaydedildi. Bu zamanlama MP4 için de kullanılabilir (render.js --timing zamanlama.json).</p><textarea readonly>${json}</textarea>
        <div class="row"><button class="btn" id="sDl">zamanlama.json indir</button></div>`;
      $('sDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = 'zamanlama.json'; a.click(); };
      await applyCues(cues);
    }
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); if (sync) mark(); else if (!startBox.hidden) startBtn.click(); else player.playing ? pause() : play(); }
  });
  $('syncBtn').onclick = () => (syncBox.hidden ? openSync(false) : (syncBox.hidden = true));

  function frame() {
    let t = Math.max(0, now());
    if (t >= STORY.duration) { pause(); player.offset = 0; t = STORY.duration - 0.001; startBox.hidden = false; startBtn.textContent = '↻ Tekrar izle'; }
    renderFrame(R, STORY, t);
    seek.value = String(Math.round((t / STORY.duration) * 1000));
    timeEl.textContent = `${fmt(t)} / ${fmt(STORY.duration)}`;
    requestAnimationFrame(frame);
  }
  (async () => {
    buildTextures();
    fitScreen();
    await fontsReady();
    rebuild(loadSavedCues() || defaultCues());
    requestAnimationFrame(frame);
    startNote.innerHTML = 'Şarkı henüz kaydedilmediği için geçici bir demo müzik çalar (ilk açılışta birkaç saniyede hazırlanır).<br>Kaydın hazır olunca <b>🎵 Şarkını yükle</b> ve <b>⏱ Senkron</b> ile klibi şarkına oturt.';
    startBtn.disabled = false;
    startBtn.onclick = () => {
      startBox.hidden = true; bar.hidden = false;
      if (!player.ac) { try { player.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { player.ac = null; } }
      if (player.offset >= STORY.duration - 0.1) player.offset = 0;
      play(); poke();
    };
    const ready = prepareAudio();
    ready.then(() => { if (player.playing) { const t = now(); pause(); player.offset = t; play(); } });
  })();
}
</script>
