      f.rotExtra = -0.12;
      if (lt > 0.9 && lt < 3.0) f.facingTarget = dr.x < f.x - 10 ? -1 : 1;
    } else {
      f.facingTarget = 1;
    }
    f.dizzyTarget = lt > 2.7 && lt < 3.4 ? 0.8 : 0;
    f.smileTarget = 1.2;
    f.mouthTarget = lt > 1.2 && lt < 1.9 ? 0.45 : 0;
    const up = range(lt, 0.2, 1.0) * (1 - range(lt, 3.0, 3.8));
    w.camera.target(f.x + 50, lerp(405, 330, up), lerp(1.25, 1.12, up));
  },

  otter(w, lt, t) {
    const f = w.frog, o = w.otter;
    f.setState(lt > 3.4 && lt < 4.6 ? 'spin' : 'swim');
    f.inWater = true;
    f.x = FrogPath.at(t);
    f.y = w.river.surf(f.x) + 34;
    o.visible = lt > 0.55;
    o.x = OTTER_X;
    const s = w.river.surf(o.x);
    o.y = lt < 1.0 ? lerp(s + 90, s + 6, easeOutBack(range(lt, 0.6, 1.0))) : s + 6;
    o.facingTarget = -1;
    if (lt < 1.0) o.setState('float');
    else if (lt < 1.6) o.setState('giggle');
    else if (lt < 2.8) {
      o.setState('spin');
      const u = range(lt, 1.6, 2.8);
      o.rotExtra = -easeInOut(u) * TAU;
      o.y += 34 * Math.sin(Math.PI * u);
    } else if (lt < 4.6) o.setState('float');
    else if (lt < 5.4) o.setState('clap');
    else o.setState('wave');

    if (lt > 0.6 && lt < 5.2) f.lookAt = { x: o.x, y: o.y - 50 };
    if (lt > 3.4 && lt < 4.6) {
      const u = range(lt, 3.4, 4.6);
      f.rotExtra = easeOutBack(u) * TAU;               // biraz beceriksiz bir takla
      f.y += 24 * Math.sin(Math.PI * u);
      f.eyeScaleTarget = 1.25;
    } else if (lt >= 4.6 && lt < 5.4) {
      f.rotExtra = Math.sin((lt - 4.6) * 9) * 0.14 * (1 - range(lt, 4.6, 5.4));
    }
    f.dizzyTarget = lt > 4.6 && lt < 5.3 ? 1 : 0;
    f.smileTarget = 1.25;
    f.mouthTarget = lt > 5.0 && lt < 5.5 ? 0.6 : 0;
    w.camera.target((f.x + o.x) / 2, 405, 1.4);
  },

  final(w, lt, t) {
    const f = w.frog, E = END_BANK_X;
    f.inWater = lt < 1.4;
    if (lt < 1.4) {
      f.setState('swim');
      f.x = FrogPath.at(t);
      f.y = w.river.surf(f.x) + 34;
    } else if (lt < 2.2) {
      f.setState('jump');
      const u = range(lt, 1.4, 2.2);
      const x0 = FrogPath.at(40.4), y0 = w.river.surf(x0) + 34;
      f.x = lerp(x0, E + 120, u);
      f.y = lerp(y0, BANK_Y, u) - 110 * 4 * u * (1 - u);
      f.rotExtra = lerp(-0.4, 0.15, u);
      f.mouthTarget = 0.6;
    } else {
      f.setState(lt < 2.35 ? 'land' : lt < 3.2 ? 'shake' : 'stand');
      f.x = E + 120;
      f.y = BANK_Y;
      if (lt >= 2.35 && lt < 3.2) f.rotExtra = Math.sin((lt - 2.35) * 40) * 0.16 * (1 - range(lt, 2.35, 3.2));
    }
    f.facingTarget = 1;
    f.turnTarget = lt > 3.3 ? 1 : 0;
    f.waveTarget = lt > 3.8 ? 1 : 0;
    f.smileTarget = 1.35;
    if (lt > 3.9) f.mouthTarget = 0.55 + 0.15 * Math.sin(lt * 6);
    f.lookTarget = { x: 0, y: 0.15 };
    if (lt < 3.3) f.lookTarget = { x: 0.8, y: 0.1 };

    // Arkadaşlar arka planda
    const enter = easeOut(range(lt, 0, 2.8));
    const off = -560 * (1 - enter);
    const fi = w.fish, d = w.duck, tu = w.turtle, o = w.otter, dr = w.dragonfly;
    fi.visible = d.visible = tu.visible = o.visible = dr.visible = true;

    const fx = E - 380 + off;
    const sf = w.river.surf(fx);
    fi.setState('swim');
    if (lt < 3.0) { fi.x = fx + 10 * Math.sin(lt * 2); fi.y = sf + 45; }
    else {
      const k = (lt - 3.0) % 1.6;
      if (k < 1.0) { fi.x = fx + lerp(-50, 50, k); fi.y = sf + 45 - 150 * 4 * k * (1 - k); }
      else { fi.x = fx + lerp(50, -50, easeInOut((k - 1.0) / 0.6)); fi.y = sf + 45; }
    }

    d.x = E - 270 + off;
    d.y = w.river.surf(d.x) + 4;
    d.facingTarget = 1;
    if (lt > 3.4) d.setState((lt - 3.4) % 1.8 < 0.8 ? 'flap' : 'float');
    else d.setState('swim');

    tu.x = E - 150 + off * 0.8;
    tu.y = w.river.surf(tu.x) + 8;
    tu.facingTarget = 1;
    tu.setState(lt > 3.6 ? 'wave' : 'swim');

    o.x = E - 465 + off;
    o.y = w.river.surf(o.x) + 6;
    o.facingTarget = 1;
    o.setState(lt > 3.2 ? 'smile' : 'float');

    dr.x = lerp(E - 700, E - 60 + 110 * Math.cos(lt * 1.6), enter);
    dr.y = BANK_Y - 250 + 26 * Math.sin(lt * 3.2);

    if (lt < 1.4) w.camera.target(f.x + 120, 400, 1.2);
    else {
      const u = easeInOut(range(lt, 3.0, 6.0));
      w.camera.target(lerp(E - 50, E - 110, u), lerp(385, 375, u), lerp(1.12, 1.4, u), 1.6);
    }
  },
};

function buildEvents() {
  const E = [];
  const on = (t, fn) => E.push({ t, fn });
  const chirp = (n) => (w) => w.sfx('chirp', { n });
  on(0.6, chirp(2)); on(1.9, chirp(3)); on(3.3, chirp(2));
  on(2.25, (w) => w.sfx('pop'));
  on(3.55, (w) => { w.sfx('pop'); w.particles.sparkles(w.frog.x, w.frog.y - 150, 5); });
  on(5.1, (w) => w.sfx('charge'));
  on(6.2, (w) => { w.sfx('zip'); w.sfx('boing'); });
  on(7.0, (w) => { w.particles.splash(FROG_WATER_X, 1.5); w.sfx('splash', { power: 1.2 }); });
  on(7.4, (w) => w.sfx('bubble', { n: 4 }));
  on(9.5, chirp(2)); on(12.2, chirp(2));
  on(14.3, (w) => w.sfx('bubble', { n: 3 }));
  on(15.1, (w) => w.sfx('pop'));
  on(16.9, (w) => { w.sfx('bubble', { n: 5 }); w.particles.bubbles(w.fish.x - 30, w.fish.y - 10, 7, 10); });
  on(18.5, (w) => w.sfx('whoosh'));
  on(20.2, (w) => w.sfx('quack'));
  on(20.55, (w) => w.sfx('quack'));
  for (const tt of [21.13, 21.4, 21.67]) on(tt, (w) => w.sfx('plink'));
  on(21.9, (w) => { w.sfx('flutter'); w.particles.drops(w.duck.x, w.duck.y - 10, 10, 210); w.particles.ripple(w.duck.x, 1.4); });
  on(22.3, (w) => w.particles.drops(w.duck.x, w.duck.y - 10, 8, 180));
  on(23.3, (w) => w.sfx('quack'));
  on(25.6, (w) => w.sfx('slide'));
  on(26.8, (w) => w.sfx('pop'));
  on(27.75, (w) => w.sfx('plink'));
  on(28.3, (w) => { w.sfx('whoosh'); w.particles.speedLines(w.frog.x - 60, w.frog.y - 60, 9); w.particles.splash(w.frog.x - 50, 0.6); });
  on(29.2, (w) => w.sfx('buzz')); on(30.4, (w) => w.sfx('buzz')); on(31.5, (w) => w.sfx('buzz'));
  on(30.2, (w) => w.sfx('pop'));
  on(31.7, (w) => w.sfx('dizzy'));
  on(32.0, (w) => w.sfx('whoosh'));
  on(33.6, (w) => { w.particles.splash(OTTER_X, 0.8); w.sfx('plop'); w.sfx('bubble', { n: 4 }); });
  on(34.0, (w) => w.sfx('giggle'));
  on(34.6, (w) => { w.sfx('whirl'); w.particles.splash(OTTER_X, 0.7); });
  on(35.75, (w) => { w.particles.splash(OTTER_X, 0.7); w.sfx('plop'); });
  on(35.9, (w) => w.sfx('pop'));
  on(36.4, (w) => { w.sfx('whirl', { pitch: 0.8 }); w.particles.splash(w.frog.x, 0.8); });
  on(37.6, (w) => { w.sfx('splash', { power: 0.5 }); w.particles.splash(w.frog.x, 0.7); w.sfx('dizzy'); });
  on(37.8, (w) => { w.sfx('giggle'); w.particles.drops(w.otter.x - 40, w.otter.y - 10, 8, 220); w.particles.bubbles(w.otter.x, w.otter.y + 30, 6, 20); });
  on(38.15, (w) => { w.sfx('giggle'); w.particles.drops(w.frog.x + 50, w.frog.y - 20, 8, 220); });
  on(40.0, chirp(2));
  on(40.4, (w) => { w.sfx('boing'); w.particles.splash(w.frog.x, 0.9); w.sfx('splash', { power: 0.6 }); });
  on(41.2, (w) => w.sfx('thump'));
  on(41.35, (w) => w.sfx('shake'));
  on(42.0, chirp(3));
  on(42.3, (w) => w.sfx('pop'));
  on(42.8, (w) => { w.sfx('chime'); w.particles.sparkles(w.frog.x, w.frog.y - 120, 10); });
  on(43.2, (w) => { for (const c of [w.fish, w.duck, w.turtle, w.otter]) w.particles.hearts(c.x, c.y - 90, 2); w.sfx('giggle'); });
  on(44.0, chirp(2));
  return E.sort((a, b) => a.t - b.t);
}

const BUBBLES = [
  { t0: 2.25, t1: 3.0, text: '?', style: 'pop', who: 'frog' },
  { t0: 6.2, t1: 7.2, text: 'ZIP!', style: 'shout', who: 'frog' },
  { t0: 15.1, t1: 15.9, text: '!', style: 'pop', who: 'frog' },
  { t0: 20.2, t1: 21.5, text: 'Vak vak!', style: 'speech', who: 'duck' },
  { t0: 26.8, t1: 27.9, text: 'Merhaba!', style: 'speech', who: 'turtle' },
  { t0: 30.2, t1: 31.1, text: 'Vay!', style: 'speech', who: 'frog' },
  { t0: 34.0, t1: 34.9, text: 'Hi hi!', style: 'speech', who: 'otter' },
  { t0: 35.9, t1: 36.7, text: 'Ben de!', style: 'speech', who: 'frog' },
  { t0: 42.9, t1: 44.4, text: 'Hoşça kalın!', style: 'speech', who: 'frog' },
];

class SceneManager {
  constructor(w) {
    this.w = w;
    this.events = buildEvents();
    this.evIdx = 0;
    this.index = 0;
  }

  update(t) {
    const w = this.w;
    let idx = SCENES.findIndex((s) => t < s.end);
    if (idx < 0) idx = SCENES.length - 1;
    this.index = idx;
    const sc = SCENES[idx];

    // Her karede varsayılanlar; yönetmen fonksiyonları gerekenleri değiştirir.
    const f = w.frog;
    f.rotExtra = 0; f.lookAt = null; f.mouthTarget = 0; f.eyeScaleTarget = 1;
    f.waveTarget = 0; f.dizzyTarget = 0; f.forceBlink = 0;
    for (const c of [w.fish, w.duck, w.turtle, w.dragonfly, w.otter]) { c.visible = false; c.rotExtra = 0; }

    DIRECTORS[sc.key](w, t - sc.start, t);

    while (this.evIdx < this.events.length && this.events[this.evIdx].t <= t + 1e-6) {
      this.events[this.evIdx].fn(w);
      this.evIdx++;
    }
  }

  anchor(who) { return this.w[who].headAnchor(); }

  drawBubbles(ctx, t) {
    for (const b of BUBBLES) {
      if (t < b.t0 || t > b.t1) continue;
      const s = easeOutBack(range(t, b.t0, b.t0 + 0.28)) * (1 - easeIn(range(t, b.t1 - 0.2, b.t1)));
      if (s <= 0.01) continue;
      const a = this.anchor(b.who);
      ctx.save();
      if (b.style === 'shout') {
        ctx.translate(a.x + 95, a.y + 30);
        ctx.rotate(-0.12 + Math.sin(t * 14) * 0.03);
        ctx.scale(s, s);
        ctx.beginPath();
        for (let i = 0; i < 28; i++) {
          const r = i % 2 ? 50 : 72;
          const ang = (i / 28) * TAU;
          ctx.lineTo(Math.cos(ang) * r * 1.25, Math.sin(ang) * r * 0.85);
        }
        ctx.closePath();
        ctx.fillStyle = '#ffe14d';
        ctx.fill();
        ctx.strokeStyle = '#ff8a00';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.font = `700 50px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeText(b.text, 0, 3);
        ctx.fillStyle = '#ff5a1f';
        ctx.fillText(b.text, 0, 3);
      } else if (b.style === 'pop') {
        ctx.translate(a.x + 30, a.y - 30 + Math.sin(t * 6) * 3);
        ctx.scale(s, s);
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#ff8a3d';
        ctx.lineWidth = 4;
        circle(ctx, 0, 0, 26);
        ctx.fill();
        ctx.stroke();
        ctx.font = `700 36px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ff6b35';
        ctx.fillText(b.text, 0, 2);
      } else {
        ctx.font = `600 28px ${FONT}`;
        const tw = ctx.measureText(b.text).width;
        const bw = tw + 36, bh = 50;
        ctx.translate(a.x, a.y + Math.sin(t * 4) * 2);
        ctx.scale(s, s);
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        roundRect(ctx, -bw / 2 + 3, -bh - 22 + 4, bw, bh, 22);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#34495e';
        ctx.lineWidth = 3.5;
        roundRect(ctx, -bw / 2, -bh - 22, bw, bh, 22);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-12, -23);
        ctx.lineTo(0, 0);
        ctx.lineTo(12, -23);
        ctx.fill();
        ctx.stroke();
        ctx.fillRect(-11, -26, 22, 6);
        ctx.fillStyle = '#34495e';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.text, 0, -bh / 2 - 21);
      }
      ctx.restore();
    }
  }

  drawOverlay(ctx, t) {
    // Hafif vinyet
    const v = ctx.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 820);
    v.addColorStop(0, 'rgba(20,40,60,0)');
    v.addColorStop(1, 'rgba(20,40,60,0.2)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    // Açılış başlığı
    if (t < 3.9) {
      const title = "Zıpzıp'ın Dere Macerası";
      const cols = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#9775fa'];
      ctx.save();
      ctx.font = `700 64px ${FONT}`;
      ctx.textBaseline = 'middle';
      const total = ctx.measureText(title).width;
      let x = W / 2 - total / 2;
      const fade = 1 - range(t, 3.4, 3.9);
      for (let i = 0; i < title.length; i++) {
        const ch = title[i];
        const cw = ctx.measureText(ch).width;
        const k = easeOutBack(range(t, 0.3 + i * 0.035, 0.75 + i * 0.035));
        if (k > 0.01 && ch !== ' ') {
          ctx.save();
          ctx.globalAlpha = fade * clamp(k, 0, 1);
          ctx.translate(x + cw / 2, 118 - 50 * (1 - k) + Math.sin(t * 3 + i * 0.5) * 3);
          ctx.lineWidth = 12;
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.strokeText(ch, 0, 0);
          ctx.fillStyle = cols[i % cols.length];
          ctx.fillText(ch, 0, 0);
          ctx.restore();
        }
        x += cw;
      }
      ctx.restore();
    }

    // Sahne adı etiketi
    for (let i = 1; i < SCENES.length; i++) {
      const sc = SCENES[i];
      const lt = t - sc.start;
      if (lt < 0.2 || lt > 2.6) continue;
      const k = easeOutBack(range(lt, 0.2, 0.7)) * (1 - easeIn(range(lt, 2.2, 2.6)));
      ctx.save();
      ctx.font = `600 26px ${FONT}`;
      const tw = ctx.measureText(sc.title).width;
      const bw = tw + 70, bh = 50;
      const y = lerp(-60, 22, k);
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      roundRect(ctx, W / 2 - bw / 2 + 3, y + 4, bw, bh, 25);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.94)';
      roundRect(ctx, W / 2 - bw / 2, y, bw, bh, 25);
      ctx.fill();
      ctx.fillStyle = sc.color;
      circle(ctx, W / 2 - bw / 2 + 28, y + bh / 2, 10);
      ctx.fill();
      ctx.fillStyle = '#2b4a6f';
      ctx.textBaseline = 'middle';
      ctx.fillText(sc.title, W / 2 - bw / 2 + 48, y + bh / 2 + 1);
      ctx.restore();
    }

    // Geçişler: açılışta siyahtan, bazı sahne aralarında yumuşak beyaz, sonda siyaha
    let black = 1 - range(t, 0, 0.9);
    black = Math.max(black, range(t, DURATION - 0.8, DURATION - 0.05));
    let white = 0;
    for (const b of [14, 24, 33]) white = Math.max(white, 0.3 * (1 - Math.abs(t - b) / 0.35));
    if (white > 0) { ctx.fillStyle = `rgba(255,255,245,${white})`; ctx.fillRect(0, 0, W, H); }
    if (black > 0) { ctx.fillStyle = `rgba(8,18,28,${black})`; ctx.fillRect(0, 0, W, H); }
  }
}

/* =====================================================================
   UYGULAMA — dünya, döngü, ekran uyumu, arayüz
   ===================================================================== */
class App {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.sound = new SoundManager();
    this.view = { s: 1, ox: 0, oy: 0 };
    this.dirty = true;
    this.reset();
  }

  reset() {
    const w = { rng: mulberry32(2024), t: 0 };
    w.sfx = (name, opts) => this.sound.play(name, opts, w.t);
    w.river = new River(w);
    w.background = new Background(w);
    w.particles = new ParticleSystem(w);
    w.camera = new Camera(540, 360, 1.05);
    w.frog = new Frog(w);
    w.fish = new Fish(w);
    w.duck = new Duck(w);
    w.turtle = new Turtle(w);
    w.dragonfly = new Dragonfly(w);
    w.otter = new Otter(w);
    w.scene = new SceneManager(w);
    this.world = w;
    this.frame = 0;
    this.simulate(0);
    this.dirty = true;
  }

  simulate(t) {
    const w = this.world;
    w.t = t;
    w.river.t = t;
    w.scene.update(t);
    for (const c of [w.frog, w.fish, w.duck, w.turtle, w.dragonfly, w.otter]) c.update(DT);
    w.particles.update(DT);
    w.camera.update(DT);
    this.sound.update(t);
  }

  step() {
    this.frame++;
    this.simulate(this.frame * DT);
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = window.innerWidth, ch = window.innerHeight;
    this.canvas.width = Math.round(cw * dpr);
    this.canvas.height = Math.round(ch * dpr);
    this.canvas.style.width = cw + 'px';
    this.canvas.style.height = ch + 'px';
    const s = Math.min(this.canvas.width / W, this.canvas.height / H);
    this.view = { s, ox: (this.canvas.width - W * s) / 2, oy: (this.canvas.height - H * s) / 2 };
    this.dirty = true;
  }

  setFixedSize(scale) {
    this.canvas.width = Math.round(W * scale);
    this.canvas.height = Math.round(H * scale);
    this.canvas.style.width = this.canvas.width + 'px';
    this.canvas.style.height = this.canvas.height + 'px';
    this.view = { s: scale, ox: 0, oy: 0 };
  }

  draw() {
    const ctx = this.ctx, v = this.view, w = this.world, cam = w.camera, t = w.t;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0d1f2d';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.setTransform(v.s, 0, 0, v.s, v.ox, v.oy);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();

    w.background.drawSky(ctx, cam, t);
    w.background.drawLayers(ctx, cam, t);

    ctx.save();
    cam.apply(ctx);
    const vb = cam.bounds();
    w.river.drawBack(ctx, vb);
    w.river.drawBanks(ctx, vb);
    w.particles.draw(ctx, 'under');
    for (const c of [w.duck, w.otter, w.frog, w.turtle, w.fish]) if (c.visible) c.draw(ctx);
    w.river.drawFront(ctx, vb);
    w.particles.draw(ctx, 'over');
    if (w.dragonfly.visible) w.dragonfly.draw(ctx);
    w.scene.drawBubbles(ctx, t);
    ctx.restore();

    w.background.drawForeground(ctx, cam, t);
    w.scene.drawOverlay(ctx, t);
    ctx.restore();
  }

  // Canlı oynatma: requestAnimationFrame + sabit 30 FPS simülasyon adımı
  start(onFinish) {
    this.onFinish = onFinish;
    this.last = null;
    this.acc = 0;
    this.finished = false;
    const tick = (now) => {
      if (this.last === null) this.last = now;
      const d = Math.min((now - this.last) / 1000, 0.25);
      this.last = now;
      this.acc += d;
      let stepped = false;
      while (this.acc >= DT) {
        this.acc -= DT;
        if (this.frame < TOTAL_FRAMES - 1) { this.step(); stepped = true; }
        else {
          this.acc = 0;
          if (!this.finished) { this.finished = true; if (this.onFinish) this.onFinish(); }
          break;
        }
      }
      if (stepped || this.dirty) { this.draw(); this.dirty = false; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  replay() {
    this.reset();
    this.finished = false;
    this.acc = 0;
    this.sound.restart(0);
  }
}

/* =====================================================================
   BAŞLAT
   ===================================================================== */
const canvas = document.getElementById('stage');
const app = new App(canvas);

if (RENDER_MODE) {
  document.body.classList.add('render');
  // render.js bu arayüzü kullanarak kareleri ve sesi MP4'e dönüştürür.
  window.KIDS = {
    W, H, FPS, DURATION, TOTAL_FRAMES,
    async init(scale) {
      try { await Promise.race([document.fonts.load(`700 40px ${FONT}`), new Promise((r) => setTimeout(r, 4000))]); } catch (e) { /* yedek font */ }
      app.setFixedSize(scale);
      app.reset();
      return true;
    },
    frame(i, quality) {
      while (app.frame < i) app.step();
      app.draw();
      return canvas.toDataURL('image/jpeg', quality || 0.92);
    },
    async audio() {
      const buf = await app.sound.renderOffline(DURATION);
      return audioBufferToWavBase64(buf);
    },
  };
} else {
  const soundBtn = document.getElementById('soundBtn');
  const replayBtn = document.getElementById('replayBtn');
  const setSoundLabel = () => { soundBtn.textContent = app.sound.enabled ? '🔊 Ses Açık' : '🔇 Sesi Aç'; };
  const enableSound = () => { if (!app.sound.enabled) { app.sound.enable(app.world.t); setSoundLabel(); } };

  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (app.sound.enabled) app.sound.disable();
    else app.sound.enable(app.world.t);
    setSoundLabel();
  });
  canvas.addEventListener('pointerdown', enableSound);
  window.addEventListener('keydown', (e) => { if (e.key === 'm' || e.key === 'M') soundBtn.click(); });
  replayBtn.addEventListener('click', () => { replayBtn.hidden = true; enableSound(); app.replay(); });

  window.addEventListener('resize', () => app.resize());
  window.addEventListener('orientationchange', () => setTimeout(() => app.resize(), 200));
  document.fonts && document.fonts.ready.then(() => { app.dirty = true; });
  app.resize();
  app.start(() => { replayBtn.hidden = false; });

  // Tarayıcı izin verirse sesi hemen başlatmayı dene (çoğu tarayıcı dokunuş bekler).
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      const probe = new AC();
      if (probe.state === 'running') { probe.close(); enableSound(); } else probe.close();
    }
  } catch (e) { /* ses kapalı başlar */ }
}
