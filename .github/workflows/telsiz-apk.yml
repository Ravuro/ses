name: Telsiz APK

on:
  push:
    branches:
      - claude/walkie-talkie-apk-build-6orj8f
    paths:
      - 'telsiz/**'
      - '.github/workflows/telsiz-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('telsiz/**/*.gradle.kts', 'telsiz/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: APK derle
        working-directory: telsiz
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK'yı adlandır
        run: |
          cp telsiz/app/build/outputs/apk/release/app-release.apk telsiz.apk
          ls -lh telsiz.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: telsiz-apk
          path: telsiz.apk
          if-no-files-found: error

      - name: Release'e koy (sabit indirme linki)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete telsiz-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create telsiz-latest telsiz.apk \
            --target "${GITHUB_SHA}" \
            --title "Telsiz APK" \
            --notes "Telefona kur: aşağıdaki telsiz.apk dosyasına dokun.

          Derleme: ${GITHUB_SHA}
          Kanal ve relay ayarı uygulama içinden yapılır."
